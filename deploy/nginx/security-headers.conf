# KRZ Attend security headers (security section 5). Included in the server block AND in every location that adds a
# header of its own: nginx drops all inherited add_header directives in a location that sets any (F12).
# $request_id is the per-response style nonce; the same value replaces __CSP_NONCE__ in index.html.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://$host; worker-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://login.microsoftonline.com; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
