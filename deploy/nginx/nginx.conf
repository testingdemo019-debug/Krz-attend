# KRZ Attend web (F12): HTTPS, the built React app, and the proxies to the backend and to go2rtc's live-video
# WebSocket. Runs as the unprivileged nginx user on a read-only root file system: pid and temp files live in /tmp.
# Certificates are mounted at runtime into /etc/nginx/certs (deploy/nginx/certs, never baked into the image).
# The go2rtc basic-auth header is rendered at start into /tmp/nginx/go2rtc-auth.conf (40-go2rtc-auth.sh).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 6m;

    # JSON access log; /oauth2/ and /login/ are logged without their query strings (authorization codes and state).
    map $request_uri $log_uri {
        ~^(?<path>/(oauth2|login)/[^?]*) $path;
        default $request_uri;
    }
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$log_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"upstream":"$upstream_response_time",'
                                '"request_id":"$request_id","agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=oauth:10m rate=2r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend {
        server backend:8080;
        keepalive 16;
    }

    # Plain HTTP only redirects.
    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        # Backend calls; the event stream and live video hold their connections longer.
        proxy_read_timeout 60s;

        # The app shell: never cached; the per-response style nonce is written into its <meta name="csp-nonce">.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            sub_filter '__CSP_NONCE__' $request_id;
            sub_filter_once off;
        }

        # Hashed build output: cached for a year.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # App routes fall back to the shell (SPA).
        location / {
            try_files $uri /index.html;
        }

        location = /healthz {
            access_log off;
            return 204;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend;
        }

        # Server-sent events: not buffered, held open.
        location /api/v1/realtime/ {
            include /etc/nginx/proxy.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_pass http://backend;
        }

        location /oauth2/ {
            limit_req zone=oauth burst=10 nodelay;
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend;
        }

        location /login/oauth2/ {
            limit_req zone=oauth burst=10 nodelay;
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend;
        }

        location = /logout {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend;
        }

        # Live video, exactly one path: the backend authorises the session (live.view) and nginx adds go2rtc's
        # basic auth, which browsers cannot send on a WebSocket.
        location = /media/api/ws {
            auth_request /_media_auth;
            include /tmp/nginx/go2rtc-auth.conf;
            proxy_set_header Authorization $go2rtc_basic_auth;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_pass http://media-relay:1984/api/ws$is_args$args;
        }

        # Nothing else of go2rtc (its admin API) is reachable from a browser.
        location /media/ {
            return 404;
        }

        location = /_media_auth {
            internal;
            proxy_pass http://backend/api/v1/media/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
