# KRZ Attend Redis (container). Not reachable from outside the Docker network; in development the port is published
# on 127.0.0.1 only (docker-compose.dev.yml). PostgreSQL is the system of record: Redis holds transport and
# short-lived data (crossings stream, overlays, config signals, heartbeats, same-day Re-ID gallery, sessions, rate limits).
bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# Durability: streams must never be lost or evicted.
appendonly yes
appendfsync everysec
maxmemory 1gb
maxmemory-policy noeviction

# Needed by the Spring Session indexed repository (the app may not run CONFIG itself).
notify-keyspace-events Egx

# Users and permissions; generated from deploy/.env by deploy/scripts/up (never committed).
aclfile /usr/local/etc/redis/users.acl
