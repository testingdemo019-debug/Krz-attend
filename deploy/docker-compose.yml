# KRZ Attend — production (runtime topology, Part A). PostgreSQL is NOT a service: it runs on the host.
# On a Windows machine the worker runs on the host as well (docker-compose.windows.yml, deploy/scripts/start-all).
# Start through deploy/scripts/up, which first renders redis/users.acl from deploy/.env and creates the data folders.
name: krz-attend

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  user: "10001:${DEPLOY_GID:-1000}"
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  redis:
    <<: *hardening
    image: redis:8.10.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    mem_limit: 1536m
    environment:
      # The health check authenticates as the PING-only user.
      REDISCLI_AUTH: ${REDIS_HEALTH_PASSWORD}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
      - ${DATA_DIR:-../data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user krz_health ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  media-relay:
    <<: *hardening
    image: alexxit/go2rtc:1.9.9
    # The config is copied into the tmpfs, so streams added through the API (with their RTSP credentials) never reach
    # a disk (P-22); go2rtc fills the credentials in from the environment.
    entrypoint: ["/bin/sh", "-c", "cp /etc/go2rtc/go2rtc.yaml /tmp/go2rtc.yaml && exec go2rtc -config /tmp/go2rtc.yaml"]
    mem_limit: 512m
    environment:
      GO2RTC_API_USER: ${GO2RTC_API_USER:-krz_relay}
      GO2RTC_API_PASSWORD: ${GO2RTC_API_PASSWORD:?run deploy/scripts/init-env}
    volumes:
      - ./go2rtc/go2rtc.yaml:/etc/go2rtc/go2rtc.yaml:ro
    healthcheck:
      # Any HTTP answer (401 without credentials) means the API is up.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:1984/api 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  worker:
    <<: *hardening
    image: krz-attend-worker:${APP_VERSION:?set APP_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: worker/Dockerfile
      args:
        RUNTIME: gpu
    mem_limit: 4g
    # Time to release held U-turn crossings and finish writing the spool (SIGTERM).
    stop_grace_period: 20s
    # The backend creates the database views the worker reads.
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:${DOCKER_HOST_GATEWAY:-172.28.0.1}"
    # Only what the worker reads (krz_worker/config.py and the key ring), never the whole .env.
    environment:
      APP_VERSION: ${APP_VERSION}
      DATA_DIR: /data
      MODELS_DIR: /models
      TRT_CACHE_DIR: /data/trt_cache
      WORKER_ID: ${WORKER_ID:-worker-1}
      WORKER_EXECUTION_PROVIDER: ${WORKER_EXECUTION_PROVIDER:-cuda}
      WORKER_GPU_DEVICE: ${WORKER_GPU_DEVICE:-0}
      WORKER_MAX_FPS: ${WORKER_MAX_FPS:-12}
      WORKER_API_PORT: ${WORKER_API_PORT:-8090}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?run deploy/scripts/init-env}
      CAMERA_DISCOVERY_SUBNET: ${CAMERA_DISCOVERY_SUBNET:-192.168.1.0/24}
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-krz_attend}
      DB_WORKER_USER: ${DB_WORKER_USER:-krz_worker}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?run deploy/scripts/init-env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_WORKER_USER: ${REDIS_WORKER_USER:-krz_worker}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:?run deploy/scripts/init-env}
      # The crop key ring. A key rotation (RUNBOOK) adds the new ENCRYPTION_KEY_<ID> here and to the backend.
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-k1}
      ENCRYPTION_KEY_k1: ${ENCRYPTION_KEY_k1:?run deploy/scripts/init-env}
    volumes:
      - ${DATA_DIR:-../data}/crops:/data/crops
      - ${DATA_DIR:-../data}/spool:/data/spool
      - ${DATA_DIR:-../data}/trt_cache:/data/trt_cache
      - ${DATA_DIR:-../data}/logs/worker:/data/logs/worker
      - ${DATA_DIR:-../data}/models:/models:ro
    # One NVIDIA GPU (NVIDIA Container Toolkit on Ubuntu, WSL2 GPU support in Docker Desktop). Without a GPU, add
    # docker-compose.cpu.yml (deploy/scripts/up --cpu).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - internal

  backend:
    <<: *hardening
    image: krz-attend-backend:${APP_VERSION:?set APP_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    mem_limit: 2g
    stop_grace_period: 25s
    depends_on:
      redis:
        condition: service_healthy
      media-relay:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:${DOCKER_HOST_GATEWAY:-172.28.0.1}"
    # Only what the backend reads (application.yml), never the whole .env.
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in deploy/.env}
      APP_VERSION: ${APP_VERSION}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in deploy/.env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      ORG_NAME: ${ORG_NAME:-KRZ Technologies Pvt. Ltd.}
      ORG_DOMAIN: ${ORG_DOMAIN:-krztechnologies.com}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      IT_HELPDESK_EMAIL: ${IT_HELPDESK_EMAIL:-}
      DATA_DIR: /data
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-krz_attend}
      DB_OWNER_USER: ${DB_OWNER_USER:-krz_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run database/bootstrap/run_bootstrap}
      DB_APP_USER: ${DB_APP_USER:-krz_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run database/bootstrap/run_bootstrap}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_BACKEND_USER: ${REDIS_BACKEND_USER:-krz_backend}
      REDIS_BACKEND_PASSWORD: ${REDIS_BACKEND_PASSWORD:?run deploy/scripts/init-env}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in deploy/.env}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID in deploy/.env}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_CLIENT_SECRET_EXPIRES: ${ENTRA_CLIENT_SECRET_EXPIRES:-}
      ENTRA_ALLOWED_DOMAIN: ${ENTRA_ALLOWED_DOMAIN:-krztechnologies.com}
      ENTRA_SYNC_SCOPE: ${ENTRA_SYNC_SCOPE:-all}
      ENTRA_SYNC_GROUP_IDS: ${ENTRA_SYNC_GROUP_IDS:-}
      ENTRA_SYNC_EXCLUDE: ${ENTRA_SYNC_EXCLUDE:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-graph}
      MAIL_SENDER: ${MAIL_SENDER:-attend-noreply@krztechnologies.com}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      HRMS_ENABLED: ${HRMS_ENABLED:-false}
      # The key ring, as for the worker. A key rotation (RUNBOOK) adds the new ENCRYPTION_KEY_<ID> here too.
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-k1}
      ENCRYPTION_KEY_k1: ${ENCRYPTION_KEY_k1:?run deploy/scripts/init-env}
      WORKER_ID: ${WORKER_ID:-worker-1}
      WORKER_API_URL: http://worker:8090
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?run deploy/scripts/init-env}
      MEDIA_RELAY_URL: http://media-relay:1984
      GO2RTC_API_USER: ${GO2RTC_API_USER:-krz_relay}
      GO2RTC_API_PASSWORD: ${GO2RTC_API_PASSWORD:?run deploy/scripts/init-env}
    volumes:
      - ${DATA_DIR:-../data}/crops:/data/crops
      - ${DATA_DIR:-../data}/uploads:/data/uploads
      - ${DATA_DIR:-../data}/logs/backend:/data/logs/backend
      - ${DATA_DIR:-../data}/backups:/data/backups:ro
    networks:
      - internal

  web:
    <<: *hardening
    image: krz-attend-web:${APP_VERSION:?set APP_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    # The image's own unprivileged nginx user.
    user: "101:101"
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy
        # nginx resolves the backend's address when it starts.
        restart: true
      media-relay:
        condition: service_healthy
        restart: true
    # Read by 40-go2rtc-auth.sh, which adds them to the live-video proxy.
    environment:
      GO2RTC_API_USER: ${GO2RTC_API_USER:-krz_relay}
      GO2RTC_API_PASSWORD: ${GO2RTC_API_PASSWORD:?run deploy/scripts/init-env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # fullchain.pem and privkey.pem (PENDING P-01); never in Git or an image.
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
      - edge

networks:
  # Fixed subnet so pg_hba.conf can allow exactly 172.28.0.0/24; the host interface is named krz-int for ufw.
  # Not "internal: true": the backend needs Microsoft Graph and the worker and media relay need the camera.
  internal:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: krz-int
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  # Only "web" (nginx) publishes ports 80/443.
  edge:
    driver: bridge
